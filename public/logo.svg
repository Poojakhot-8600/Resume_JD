<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <linearGradient id="globeGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#1e3a5b"/>
      <stop offset="55%" stop-color="#1a5a6b"/>
      <stop offset="100%" stop-color="#02a297"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="60" cy="60" r="52"/>
    </clipPath>
  </defs>

  <!-- Globe Icon -->
  <g id="icon">
    <!-- Globe Base -->
    <circle cx="60" cy="60" r="52" fill="url(#globeGradient)"/>

    <!-- Globe Grid Lines (clipped to circle) -->
    <g clip-path="url(#globeClip)" stroke="#ffffff" stroke-width="1.2" opacity="0.32" fill="none">
      <!-- Latitude Lines -->
      <ellipse cx="60" cy="60" rx="52" ry="14"/>
      <ellipse cx="60" cy="60" rx="52" ry="32"/>
      <line x1="8" y1="60" x2="112" y2="60"/>
      <line x1="8" y1="36" x2="112" y2="36" stroke-dasharray="2,2" opacity="0.2"/>
      <line x1="8" y1="84" x2="112" y2="84" stroke-dasharray="2,2" opacity="0.2"/>

      <!-- Longitude Lines -->
      <ellipse cx="60" cy="60" rx="18" ry="52"/>
      <ellipse cx="60" cy="60" rx="36" ry="52"/>
      <line x1="60" y1="8" x2="60" y2="112"/>
    </g>

    <!-- Stylized White Letter "A" -->
    <path d="M 60 17 L 37 87 L 49 87 L 54 70 L 66 70 L 71 87 L 83 87 Z M 60 38 L 64.5 59 L 55.5 59 Z" fill="#ffffff"/>
  </g>

  <!-- Text "AppstraxGlobal" -->
  <g id="text" transform="translate(136, 0)">
    <text x="0" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="-0.5">
      <tspan fill="#1e2d4a">Appstrax</tspan><tspan fill="#00a896">Global</tspan>
    </text>
    <text x="3" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="14.5" fill="#60728c" letter-spacing="5.5">
      APPS WITHOUT BORDERS
    </text>
  </g>
</svg>
